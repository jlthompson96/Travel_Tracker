<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Travel Tracker — every trip in your Notion database as a passport, a map and a timeline">
  <style>
    .route { stroke-dasharray: 2 9; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -11 } }
    .thud { animation: thud 7s ease-out infinite; transform-origin: 0 0; }
    .thud2 { animation-delay: -3.5s }
    @keyframes thud { 0% { transform: scale(1.5); opacity: 0 } 6% { transform: scale(.94); opacity: .95 } 10% { transform: scale(1) } 85% { opacity: .95 } 100% { opacity: .95 } }
    .pin { animation: pin 2.4s ease-in-out infinite; transform-origin: 1095px 112px; }
    @keyframes pin { 0%,100% { transform: scale(1); opacity: .6 } 50% { transform: scale(1.8); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .route, .thud, .pin { animation: none } .plane { display: none } }
  </style>
  <defs>
    <pattern id="paper" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.6" fill="#14232E" fill-opacity="0.05"/></pattern>
    <pattern id="lat" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#14232E" stroke-opacity="0.06"/></pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#14232E"/>
    <!-- ticket stub -->
    <rect x="24" y="24" width="1152" height="272" rx="10" fill="#F7F2E7"/>
    <rect x="24" y="24" width="1152" height="272" rx="10" fill="url(#lat)"/>
    <rect x="24" y="24" width="1152" height="272" rx="10" fill="url(#paper)"/>
    <line x1="660" y1="40" x2="660" y2="280" stroke="#14232E" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="660" cy="24" r="12" fill="#14232E"/><circle cx="660" cy="296" r="12" fill="#14232E"/>
    <rect x="24" y="24" width="1152" height="10" fill="#B98B3E" opacity="0.9"/>
    <text x="70" y="88" font-family="'IBM Plex Mono', Consolas, Menlo, monospace" font-size="12" letter-spacing="3" fill="#7A5A1E">BOARDING PASS · NOTION → VERCEL</text>
    <text x="68" y="160" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#14232E">Travel <tspan font-style="italic" fill="#A6392B">Tracker</tspan></text>
    <text x="70" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#33362E">Every trip you've taken, and every one you</text>
    <text x="70" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#33362E">want to, as a passport, a map and a timeline.</text>
    <text x="70" y="268" font-family="'IBM Plex Mono', Consolas, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#7A5A1E">TRIPS · MAP · TIMELINE · PASSPORT · MILES · INSIGHTS · PLAN · COMPARE</text>
